# Temporary Render test environment; keep the database and app in the same region for private networking.
databases:
  - name: guidancesched-db
    databaseName: guidancesched
    user: guidance
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: guidancesched-test
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        # Render prompts for the generated Laravel key; never commit the key to this file.
        sync: false
      - key: APP_URL
        fromService:
          name: guidancesched-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSET_URL
        fromService:
          name: guidancesched-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        # Inject the private database connection string rather than storing credentials in Git.
        fromDatabase:
          name: guidancesched-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_LEVEL
        value: warning
